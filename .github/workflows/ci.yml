name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Test
        run: npm test -- --ci

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # ubuntu-latest imajinda her SDK bileseninin her surumu yok;
      # build.gradle'daki surumlerle birebir eslesmesi gerekiyor.
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;26.1.10909125"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - run: npm ci

      - name: Pod install
        run: cd ios && bundle exec pod install

      - name: Build
        run: |
          xcodebuild -workspace ios/PrayerTimes.xcworkspace \
            -scheme PrayerTimes \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
