name: Release APK

# Yalnizca etiket atildiginda calisir; PR basina Actions kotasi harcamaz.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiket adi (ornek: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # ubuntu-latest imajinda build.gradle'daki tam surumler yok.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;26.1.10909125"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 tanimli degil. Ayarlar > Secrets > Actions altina ekleyin."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Resolve version from tag
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          PATCH=${PATCH:-0}
          # 1.2.3 -> 10203. Her yayinda artmali; ayni surum kodu kurulumu bozar.
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Surum: $NAME ($CODE)"

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ env.VERSION_NAME }}
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Sessiz tuzak: keystore yoksa Gradle debug anahtariyla imzalar ve APK
      # kurulabilir gorunur. Bu adim o durumu yakalar.
      - name: Verify signing certificate
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          CERT=$(apksigner verify --print-certs "$APK" | grep -i 'certificate DN' || true)
          echo "$CERT"
          if echo "$CERT" | grep -qi 'CN=Android Debug'; then
            echo "::error::APK hala debug anahtariyla imzali; keystore secret'lari kontrol edin."
            exit 1
          fi

      - name: Rename APK
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "kalkkil-$TAG.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: kalkkil-*.apk
          draft: true
          generate_release_notes: true
