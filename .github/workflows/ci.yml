name: CI

# Ucretsiz GitHub Actions kotasi dar: burada yalnizca hizli kontroller var.
# Android/iOS derlemeleri bilerek buraya alinmadi, elle tetiklenir ve yerelde
# dogrulanir (bkz. README "Dogrulama").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Test
        run: npm test -- --ci
